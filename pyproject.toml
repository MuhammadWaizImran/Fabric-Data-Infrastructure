[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-fabric-analytics"
version = "0.1.0"
description = "Repository blueprint for the supplied Azure and Microsoft Fabric end-to-end architecture"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
azure = ["azure-identity>=1.19,<2", "azure-eventhub>=5.12,<6", "azure-storage-file-datalake>=12.18,<13"]
ml = ["scikit-learn>=1.5,<2", "pandas>=2.2,<3", "mlflow>=2.17,<4"]

[tool.setuptools.packages.find]
where = ["src"]
